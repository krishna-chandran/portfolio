baseURL = "https://krishna-chandran.github.io/portfolio/"

# baseURL = "http://localhost:1313/resume"
defaultContentLanguage = "en"
title = "Krishnakumar Chandran"
theme = 'hugo-theme-flat'

enableRobotsTXT = true
hasCJKLanguage = true
enableGitInfo = false

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[pagination]
pagerSize = 8

# these values are hugo built in markup config
[markup.highlight]
anchorLineNos = false
codeFences = true
guessSyntax = false
hl_Lines = ''
lineAnchors = ''
lineNoStart = 1
lineNos = false
lineNumbersInTable = false
noClasses = false
noHl = false
style = 'monokailight'
tabWidth = 4

[markup.goldmark.renderer] 
unsafe= true

