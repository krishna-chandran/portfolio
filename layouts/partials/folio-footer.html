<footer class="footer">
    <div class="footer-row">
        <a class="footer-item" href="{{ "folio/" | relURL }}">Portfolio</a>
        <a class="footer-item" href="{{ .Site.Home.RelPermalink }}">Newspaper</a>
    </div>

    {{ range .Site.Params.footer_rows }}
        <div class="footer-row">
            {{ range .items }}
                {{ with .pre }}
                    <span class="footer-item">{{ . | safeHTML }}</span>
                {{ else }}
                    <a class="footer-item" href="{{ .url }}">{{ .name }}</a>
                {{ end }}
            {{ end }}
        </div>
    {{ end }}
</footer>
